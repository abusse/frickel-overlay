uni-meter {
  http-server {
    port = 8081
  }

  output = "uni-meter.output-devices.shelly-pro3em"
  input  = "uni-meter.input-devices.home-assistant"

  output-devices {
    shelly-pro3em {
      port = 8080
      udp-port = 1010
      udp-interface = "0.0.0.0"

      device {
        mac  = "A0:B7:65:44:22:11"
        host = "10.1.0.5"
        name = "virtual-shelly-pro3em"
      }

      power-offset = 0
      phase-mode = "combined"
    }
  }

  input-devices {
    home-assistant {
      url = "http://10.1.0.2:8123"
      access-token = "YOUR_LONG_LIVED_TOKEN"

      power-phase-mode = "tri-phase"
      energy-phase-mode = "mono-phase"

      power-l1-sensor = "sensor.smart_meter_l1_active_instantaneous_power"
      power-l2-sensor = "sensor.smart_meter_l2_active_instantaneous_power"
      power-l3-sensor = "sensor.smart_meter_l3_active_instantaneous_power"

      energy-consumption-sensor = "sensor.smart_meter_positive_active_energy_total"
      energy-production-sensor  = "sensor.smart_meter_negative_active_energy_total"
    }
  }
}
